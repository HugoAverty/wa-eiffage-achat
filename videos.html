<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vidéos locales (4)</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #e8eef5;
      --muted: #a8b3c7;
      --radius: 16px;
      --gap: 18px;
      --border: rgba(255,255,255,.08);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 800px at 20% 0%, #141824 0%, var(--bg) 50%) fixed;
      color: var(--text);
      line-height: 1.45;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 18px 40px; }
    header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(20px, 4vw, 28px); letter-spacing: .2px; }
    .hint { color: var(--muted); font-size: 14px; }

    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--gap); }
    .col { grid-column: span 12; }
    @media (min-width: 720px) { .col { grid-column: span 6; } }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.00));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05);
      border-color: rgba(90,169,255,0.35);
    }

    .title { margin: 0 0 10px 2px; font-weight: 600; font-size: 16px; color: #f2f6ff; }
    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background: #0b0d12;
      border: 1px solid var(--border);
    }
    video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }
    .meta {
      display: flex; align-items: center; gap: 8px; justify-content: space-between;
      margin-top: 10px; color: var(--muted); font-size: 13px;
    }
    .btn {
      appearance: none; border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      color: var(--text); padding: 6px 10px; border-radius: 10px; cursor: pointer;
      font-weight: 600; transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
      box-shadow: 0 6px 14px rgba(0,0,0,.25); font-size: 13px;
    }
    .btn:hover { transform: translateY(-1px); border-color: rgba(90,169,255,.45); box-shadow: 0 10px 20px rgba(0,0,0,.32); }
    footer { margin-top: 22px; color: var(--muted); font-size: 13px; }
    code { padding: 2px 6px; border-radius: 6px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.07); color: #e6f0ff; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Vidéos </h1>
    </header>

    <div id="grid" class="grid" aria-live="polite"></div>

  </div>

  <script>
    /**
     * ➜ Renseigne ici tes 4 vidéos locales (même dossier que index.html)
     *    src  : nom de fichier (ex: "teaser.mp4")
     *    title: titre à afficher
     *    (optionnel) subtitles: nom de fichier VTT (ex: "teaser.vtt")
     */
    const videos = [
      { src: "Quel produit peut-on commander sur BlueOn.mp4", title: "Vidéo 1", subtitles: "" },
      { src: "Tuto vidéo - Comment faire une demande d_achat détaillée sur Spring depuis BlueOn.mp4", title: "Vidéo 2", subtitles: "" },
      { src: "Tuto vidéo - Comment se connecter à BlueOn.mp4", title: "Vidéo 3", subtitles: "" },
      { src: "Vidéo de présentation BlueOn.mp4", title: "Vidéo 4", subtitles: "" },
    ];

    // Essaie d'auto-déduire un poster si un fichier image du même nom existe (jpg/png/webp)
    const POSTER_EXTS = [".jpg", ".jpeg", ".png", ".webp"];

    function basename(filename) {
      const i = filename.lastIndexOf(".");
      return i >= 0 ? filename.slice(0, i) : filename;
    }
    function withExt(name, ext) {
      return name + ext;
    }

    function createCard({ title, src, subtitles }) {
      const col = document.createElement("div");
      col.className = "col";

      const card = document.createElement("div");
      card.className = "card";

      const h3 = document.createElement("h3");
      h3.className = "title";
      h3.textContent = title || src;

      const frame = document.createElement("div");
      frame.className = "frame";

      // <video> setup
      const video = document.createElement("video");
      video.setAttribute("controls", "");
      video.setAttribute("playsinline", "");
      video.setAttribute("preload", "metadata");
      video.setAttribute("title", title || src);

      // Poster auto (on ne peut pas vérifier l'existence du fichier côté client sans requête,
      // donc on tente les extensions les plus courantes — si le fichier n'existe pas, aucun souci).
      const base = basename(src);
      video.poster = POSTER_EXTS.map(ext => withExt(base, ext))[0]; // premier essai

      const source = document.createElement("source");
      source.src = src;
      // type MIME basique en fonction de l'extension
      if (src.toLowerCase().endsWith(".mp4")) source.type = "video/mp4";
      else if (src.toLowerCase().endsWith(".webm")) source.type = "video/webm";
      video.appendChild(source);

      // Sous-titres VTT facultatifs
      if (subtitles) {
        const track = document.createElement("track");
        track.kind = "subtitles";
        track.label = "Français";
        track.srclang = "fr";
        track.src = subtitles;
        track.default = true;
        video.appendChild(track);
      }

      // UX : cliquer sur la carte met en lecture/pause
      frame.addEventListener("click", (e) => {
        // évite conflit avec les contrôles natifs
        if (e.target.tagName.toLowerCase() === "video" || e.target.closest("button") || e.target.closest("input")) return;
        if (video.paused) video.play().catch(()=>{});
        else video.pause();
      });

      frame.appendChild(video);
      card.appendChild(h3);
      card.appendChild(frame);

      // Barre meta (taille estimée après metadata)
      const meta = document.createElement("div");
      meta.className = "meta";
      const left = document.createElement("span");
      left.textContent = src;
      const right = document.createElement("button");
      right.className = "btn";
      right.type = "button";
      right.textContent = "▶︎ Lire / Pause";
      right.addEventListener("click", () => {
        if (video.paused) video.play().catch(()=>{});
        else video.pause();
      });
      meta.append(left, right);
      card.appendChild(meta);

      col.appendChild(card);
      return col;
    }

    (function render() {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      const items = videos.slice(0, 4).filter(v => v && v.src);
      if (!items.length) {
        const note = document.createElement("p");
        note.textContent = "Aucune vidéo renseignée. Ajoute 4 entrées dans le tableau « videos » du script.";
        grid.appendChild(note);
        return;
      }
      for (const it of items) grid.appendChild(createCard(it));
    })();
  </script>
</body>
</html>
